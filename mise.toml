# Local tool management, and the single declaration of the JDK.
#
# CI installs these same tools with jdx/mise-action, so the pipeline and a
# developer machine resolve the same builds. The sbt entry provides the
# launcher only; project/build.properties pins the sbt that the build runs.
[tools]
java = "temurin-25"
sbt  = "1.12.11"
