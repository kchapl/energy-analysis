name: Toolchain drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: sbt

      - uses: sbt/setup-sbt@v1.5.15

      - name: Snapshot the versions upstream publishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today=$(date -u +%F)

          java_json=$(curl -fsS https://endoflife.date/api/eclipse-temurin.json)
          scala_json=$(curl -fsS https://endoflife.date/api/scala.json)

          jdk_newest=$(jq -r --arg today "$today" '
            [ .[] | select((.eol == false) or (.eol > $today)) ]
            | max_by(.cycle | tonumber) | .latest' <<<"$java_json")
          jdk_lts=$(jq -r --arg today "$today" '
            [ .[] | select(.lts == true) | select((.eol == false) or (.eol > $today)) ]
            | sort_by(.cycle | tonumber) | map(.latest) | join(",")' <<<"$java_json")

          scala_newest=$(jq -r --arg today "$today" '
            [ .[] | select((.eol == false) or (.eol > $today)) ]
            | max_by(.cycle | split(".") | map(tonumber)) | .latest' <<<"$scala_json")
          scala_lts=$(jq -r --arg today "$today" '
            [ .[] | select(.lts == true) | select((.eol == false) or (.eol > $today)) ]
            | sort_by(.cycle | split(".") | map(tonumber))
            | map(.latest) | join(",")' <<<"$scala_json")

          sbt_newest=$(gh api "repos/sbt/sbt/releases?per_page=100" --jq '
            [ .[] | select(.prerelease | not) | .tag_name | ltrimstr("v") ]
            | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
            | map({ raw: ., parts: (split(".") | map(tonumber)) })
            | max_by(.parts) | .raw')

          {
            echo "jdk   latest=$jdk_newest lts=$jdk_lts"
            echo "scala latest=$scala_newest lts=$scala_lts"
            echo "sbt   latest=$sbt_newest"
          } > toolchain-snapshot.txt

          cat toolchain-snapshot.txt

      - name: Check the declared versions against the policy
        run: |
          set -euo pipefail
          log=$(sbt --batch "runMain energyanalysis.ToolchainCheck --snapshot toolchain-snapshot.txt" 2>&1) || true
          printf '%s\n' "$log"

          status=$(printf '%s\n' "$log" | grep -E '^status: (ok|drift|fail)$' | tail -1 || true)
          case "$status" in
            "status: ok")    exit 0 ;;
            "status: drift") echo "::warning::a newer version is available for one of the declared tools" ;;
            *)
              echo "::error::a declared version is outside the toolchain policy"
              exit 1
              ;;
          esac
